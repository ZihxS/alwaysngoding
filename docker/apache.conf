ServerName localhost

# Local development: refresh always loads the latest code and source assets.
<IfModule mod_headers.c>
    Header always set Cache-Control "no-store"
</IfModule>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/(docker|scripts|socket|vendor)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(Dockerfile|Makefile|compose\.ya?ml|composer\.(json|lock)|\.dockerignore)$">
    Require all denied
</FilesMatch>
